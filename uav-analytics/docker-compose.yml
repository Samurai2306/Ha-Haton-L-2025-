version: "3.9"
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: uav-api
    environment:
      - API_PORT=${API_PORT:-8000}
      - API_HOST=0.0.0.0
      - API_TOKEN=${API_TOKEN:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - FILE_FLIGHTS=/data/flights_normalized.csv
      - FILE_DAILY=/data/daily_aggregates.csv
      - FILE_FORECAST=/data/forecast_14d.csv
      - FILE_QA=/data/qa_issues.csv
    volumes:
      - ./flights_normalized.csv:/data/flights_normalized.csv:rw
      - ./daily_aggregates.csv:/data/daily_aggregates.csv:rw
      - ./forecast_14d.csv:/data/forecast_14d.csv:rw
      - ./qa_issues.csv:/data/qa_issues.csv:rw
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
